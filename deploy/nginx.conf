# ChumChum CRM — reverse proxy cho VPS Ubuntu
#
# Cài đặt (xem đầy đủ docs/DEPLOY-VPS.md):
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/chumchum
#   sudo ln -s /etc/nginx/sites-available/chumchum /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d chat.chumchumbakery.com -d api.chumchumbakery.com

# Header chuẩn cho WebSocket (socket.io)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- Web (Next.js) — chat.chumchumbakery.com ---
server {
    listen 80;
    server_name chat.chumchumbakery.com;

    # Attachment upload (điều chỉnh nếu cần ảnh lớn)
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# --- API (NestJS + socket.io) — api.chumchumbakery.com ---
server {
    listen 80;
    server_name api.chumchumbakery.com;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        # Bắt buộc cho WebSocket / socket.io
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Giữ kết nối socket lâu hơn timeout mặc định (60s)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
